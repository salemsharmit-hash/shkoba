<title>شكوبة · Shkoba</title>
<style>
:root{--felt:#0f5a43;--felt2:#0b4332;--gold:#e8c35a;--ink:#1c1b22;--paper:#fbf6e8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--felt2);color:#fff;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;overscroll-behavior:none}
#app{max-width:720px;margin:0 auto;height:100%;padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 40%,var(--felt),var(--felt2));position:relative;overflow:hidden}
.screen{display:none;height:100%;flex-direction:column;gap:8px}
.screen.on{display:flex}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--gold);color:#3a2a00;font-weight:700;cursor:pointer}
button.ghost{background:rgba(255,255,255,.15);color:#fff}
button:disabled{opacity:.4}
h1{margin:4px 0;color:var(--gold);text-align:center;font-size:34px}
.sub{text-align:center;opacity:.8;font-size:13px;margin-bottom:4px}
.opt{background:rgba(0,0,0,.22);border-radius:12px;padding:8px 10px}
.opt>.lbl{font-size:12px;opacity:.8;margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;background:rgba(255,255,255,.14);color:#fff}
.seg button.on{background:var(--gold);color:#3a2a00}
input[type=number],input[type=text]{font:inherit;padding:8px;border-radius:8px;border:2px solid var(--gold);background:#0b3326;color:#fff;width:100%;text-align:center}
.menu-body{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px}
/* game */
#board{direction:ltr;flex:1;display:flex;flex-direction:column;gap:4px;min-height:0}
#scorebar{direction:inherit;display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:6px}
#scorebar b{color:var(--gold)}
#topSeat{display:flex;justify-content:center}
#mid{flex:1;display:flex;gap:4px;min-height:0;align-items:stretch}
#table{flex:1;background:rgba(0,0,0,.18);border:2px dashed rgba(232,195,90,.4);border-radius:16px;display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-content:center;padding:6px}
.side{width:52px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.seat{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;text-align:center;unicode-bidi:plaintext}
.seat .hand{display:flex}
.seat.v .hand{flex-direction:column}
.seat.turn .nm{color:var(--gold);font-weight:800}
.seat .nm::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:4px;background:#8ec9ff}
.seat.mine .nm::before{background:var(--gold)}
.seat .hand .card{margin:0 -10px 0 0}
.seat.v .hand .card{margin:-34px 0 0 0}
.seat.v .hand .card:first-child{margin-top:0}
#me{display:flex;gap:8px;justify-content:center;min-height:100px;align-items:flex-end}
.card{width:60px;height:90px;border-radius:7px;background:#fff;border:1px solid #bdbdbd;box-shadow:0 2px 4px rgba(0,0,0,.45);cursor:pointer;flex:none;transition:transform .12s;position:relative;user-select:none}
.card svg{width:100%;height:100%;display:block}
.card.small{width:54px;height:81px}
.card.tiny{width:30px;height:45px;cursor:default}
.card.back{background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.85) 6px 7.4px),repeating-linear-gradient(-45deg,transparent 0 6px,rgba(255,255,255,.85) 6px 7.4px),#e4572e;border:4px solid #fff;outline:1px solid #bdbdbd;outline-offset:-1px;cursor:default}
.card.back::after{content:"";position:absolute;left:50%;top:50%;width:46%;height:34%;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:2px solid #b8321a;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 3px #b8321a}
.card.tiny.back{border-width:2px}
.card.tiny.back::after{border-width:1px;box-shadow:none}
.card.sel{transform:translateY(-12px);box-shadow:0 0 0 3px var(--gold)}
.card.chk{box-shadow:0 0 0 2px #e8c35a,0 0 9px 3px rgba(232,195,90,.85)}
.card.pick{box-shadow:0 0 0 3px #00e5ff}
.card.hint{box-shadow:0 0 0 2px #fff}
#status{text-align:center;min-height:20px;font-size:14px}
#log{text-align:center;font-size:12px;opacity:.85;min-height:16px}
.acts{display:flex;gap:8px;justify-content:center}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal.on{display:flex}
#modal .box{background:#1b3a2f;border:2px solid var(--gold);border-radius:16px;max-width:420px;width:100%;padding:16px;max-height:92%;overflow:auto}
#modal h2{margin:0 0 8px;color:var(--gold)}
table{width:100%;border-collapse:collapse;margin:8px 0}
td,th{padding:4px 6px;text-align:center;border-bottom:1px solid rgba(255,255,255,.15);font-size:14px}
.code{font-size:44px;letter-spacing:8px;text-align:center;color:var(--gold);font-weight:800;direction:ltr}
.seatrow{display:flex;justify-content:space-between;padding:6px 10px;background:rgba(0,0,0,.2);border-radius:8px;margin:4px 0}
.err{color:#ffb4a8;text-align:center;font-size:13px;min-height:18px}
#fx{position:absolute;inset:0;pointer-events:none;z-index:15;overflow:hidden}
.chk{position:absolute;left:50%;top:36%;font-size:48px;font-weight:900;color:var(--gold);text-shadow:0 3px 14px #000;white-space:nowrap;animation:chk 1.6s ease-out forwards}
@keyframes chk{0%{transform:translate(-50%,-50%) scale(.2) rotate(-10deg);opacity:0}22%{transform:translate(-50%,-50%) scale(1.3) rotate(4deg);opacity:1}45%{transform:translate(-50%,-50%) scale(1) rotate(0)}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
.conf{position:absolute;top:38%;left:50%;width:9px;height:14px;border-radius:2px;animation:conf 1.4s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
.flycard{position:fixed;z-index:20;pointer-events:none;margin:0;transition:none}
#modal.on .box{animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.pulse{animation:pulse .6s ease-out}
@keyframes pulse{40%{transform:scale(1.25);color:var(--gold)}}
.seat.turn .nm{animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{text-shadow:0 0 10px var(--gold)}}
.card:not(.back):not(.tiny):active{transform:scale(.95)}
#me .card:hover{transform:translateY(-4px)}
#me .card.sel{transform:translateY(-12px)}
button:active{transform:scale(.96)}
.pile{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin:6px 0;max-height:130px;overflow:auto;direction:ltr}
.strow{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:14px}
.strow button.st{padding:2px 13px;font-size:18px;margin:0 6px}
.strow b{display:inline-block;min-width:26px;text-align:center}
.deckpile{cursor:pointer;animation:wob 1.3s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-4deg) translateY(-3px)}}
.flipin{animation:flipin .6s ease-out}
@keyframes flipin{from{transform:rotateY(90deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  rulesText:`<p>٤٠ ورقة: ♥♦♣♠ من ١ (الآص) إلى ٧، ثم البنت Q = ٨ والولد J = ٩ والملك K = ١٠. الديناري = ♦.</p>

/* ================= cards ================= */
const rl=r=>r===1?'A':r<=7?String(r):['Q','J','K'][r-8];
const COIN=1; // diamonds
const PIPS={1:[[30,45]],2:[[30,24],[30,66]],3:[[30,24],[30,45],[30,66]],4:[[22,26],[38,26],[22,64],[38,64]],5:[[22,26],[38,26],[30,45],[22,64],[38,64]],6:[[22,26],[38,26],[22,45],[38,45],[22,64],[38,64]],7:[[22,26],[38,26],[30,35],[22,45],[38,45],[22,64],[38,64]]};
function courtHalf(r){ // upper half of a traditional court figure (Anglo-American style, as on Tunisian packs)
  const K='#1c1b22',skin='#f2cfa5',hair='#6b3f1d',red='#c0392b',blue='#2c4ea1',gold='#e0b11f';
  let g=`<path d="M12 45L14 35Q20 31 30 31Q40 31 46 35L48 45Z" fill="${red}" stroke="${K}" stroke-width=".8"/>`
   +`<path d="M30 31L24 45H36Z" fill="${gold}" stroke="${K}" stroke-width=".6"/>`
   +`<path d="M14 35L12 45H19L20 33Z" fill="${blue}"/><path d="M46 35L48 45H41L40 33Z" fill="${blue}"/>`
   +`<rect x="27.5" y="28" width="5" height="4" fill="${skin}"/><ellipse cx="30" cy="25" rx="5.2" ry="6" fill="${skin}" stroke="${K}" stroke-width=".7"/>`
   +`<circle cx="28" cy="24.5" r=".6" fill="${K}"/><circle cx="32" cy="24.5" r=".6" fill="${K}"/>`;
  if(r===10)g+=`<path d="M25 26Q30 36 35 26Q33 30 30 30Q27 30 25 26Z" fill="${hair}"/><path d="M26.5 22H33.5" stroke="${hair}" stroke-width="1"/>`
   +`<path d="M24.5 20L25.5 12L28 16L30 11L32 16L34.5 12L35.5 20Z" fill="${gold}" stroke="${K}" stroke-width=".7"/>`;
  else if(r===8)g+=`<path d="M24.5 22Q22 30 25 38L26 28ZM35.5 22Q38 30 35 38L34 28Z" fill="${hair}"/>`
   +`<path d="M25 20L26 14L28.5 17L30 13L31.5 17L34 14L35 20Z" fill="${gold}" stroke="${K}" stroke-width=".7"/><circle cx="30" cy="12.3" r="1.2" fill="${red}"/>`;
  else g+=`<path d="M24.8 22Q30 12 35.2 22Q30 19 24.8 22Z" fill="${blue}" stroke="${K}" stroke-width=".7"/><path d="M33 17Q40 11 41 17" fill="none" stroke="${red}" stroke-width="1.6"/>`
   +`<path d="M24.6 24Q24 28 25.8 29L25.5 24ZM35.4 24Q36 28 34.2 29L34.5 24Z" fill="${hair}"/>`;
  return g;
}
function cardSVG(c){
  const col=c.s<2?'#d02a1c':'#1c1b22';
  const idx=(x,end)=>`<text x="${x}" y="13" font-size="13" font-weight="800" text-anchor="${end?'end':'start'}" fill="${col}" font-family="Arial,Helvetica,sans-serif">${rl(c.r)}</text><use href="#s${c.s}" x="${end?x-8.5:x-1}" y="15" width="9.5" height="9.5" style="color:${col}"/>`;
  let g=idx(5,false)+idx(55,true)+`<g transform="rotate(180 30 45)">${idx(5,false)}${idx(55,true)}</g>`;
  if(c.r<=7){
    PIPS[c.r].forEach(([x,y])=>{const sz=c.r===1?34:15;const rot=y>45?` transform="rotate(180 ${x} ${y})"`:'';
      g+=`<use href="#s${c.s}" x="${x-sz/2}" y="${y-sz/2}" width="${sz}" height="${sz}" style="color:${col}"${rot}/>`});
  }else{
    g+=`<rect x="15" y="19" width="30" height="52" rx="2" fill="#fffbe8" stroke="${col}" stroke-width="1"/>`
     +`<g transform="translate(30 45) scale(.74) translate(-30 -45)">${courtHalf(c.r)}</g>`
     +`<g transform="rotate(180 30 45)"><g transform="translate(30 45) scale(.74) translate(-30 -45)">${courtHalf(c.r)}</g></g>`
     +`<line x1="15" y1="45" x2="45" y2="45" stroke="${col}" stroke-width=".5"/>`
     +`<use href="#s${c.s}" x="16.5" y="20.5" width="6.5" height="6.5" style="color:${col}"/><g transform="rotate(180 30 45)"><use href="#s${c.s}" x="16.5" y="20.5" width="6.5" height="6.5" style="color:${col}"/></g>`;
  }
  return `<svg viewBox="0 0 60 90" style="direction:ltr">${g}</svg>`;
}
function cardEl(c,cls=''){const d=document.createElement('div');
  if(!c){d.className='card back '+cls;return d}
  d.className='card '+(c.chk?'chk ':'')+cls;d.innerHTML=cardSVG(c);return d}

/* ================= engine (runs on the host/offline device) ================= */
const teamOf=(n,s)=>n===2?s:s%2; // 2v2: partners sit across from each other
function newDeck(){const d=[];for(let s=0;s<4;s++)for(let r=1;r<=10;r++)d.push({s,r,id:s*10+r});
  for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}return d}
function legalCaptures(card,table){
  const eq=table.filter(c=>c.r===card.r);
  if(eq.length)return eq.map(c=>[c]);
  const res=[],n=table.length;
  for(let m=1;m<(1<<n);m++){let sum=0;const set=[];for(let i=0;i<n;i++)if(m&(1<<i)){sum+=table[i].r;set.push(table[i])}if(sum===card.r)res.push(set)}
  return res;
}
function makeGame(cfg){
  const g={n:cfg.n,target:cfg.target,diff:cfg.diff,types:cfg.types.slice(),scores:[0,0],dealer:Math.floor(Math.random()*cfg.n),winner:null,bumped:0,evN:0,reset:[false,false],real:!!cfg.real,roundNo:1};
  if(g.real)g.runner=g.dealer;
  newRound(g);return g;
}
function dealHands(g,extra){for(let p=0;p<g.n;p++)g.hands[p]=(extra&&extra.seat===p)?[extra.card,...g.deck.splice(0,2)]:g.deck.splice(0,3);g.firstPlay=true}
function newRound(g){
  g.deck=newDeck();g.hands=Array.from({length:g.n},()=>[]);
  g.cap=[[],[]];g.shk=[0,0];g.last=null;g.over=false;g.rows=null;g.ev=null;g.bumped=0;g.reset=[false,false];
  g.rep=[null,null];g.dec=[null,null];g.truth=null;g.verdict=[null,null];g.cutCard=null;
  if(g.real){g.table=[];g.phase='cut';g.cutter=(g.runner+1)%g.n;g.turn=-1}
  else{g.table=g.deck.splice(0,4);dealHands(g);g.phase='play';g.turn=(g.dealer+1)%g.n}
}
/* realistic style: the cutter taps to cut, sees the top card, keeps it (in hand) or puts it on the table */
function doCut(g,seat){
  if(g.phase!=='cut'||seat!==g.cutter||g.cutCard)return false;
  const k=1+Math.floor(Math.random()*(g.deck.length-1));
  g.deck=g.deck.slice(k).concat(g.deck.slice(0,k));g.cutCard=g.deck[0];return true;
}
function doKeep(g,seat,keep){
  if(g.phase!=='cut'||seat!==g.cutter||!g.cutCard)return false;
  const c=g.deck.shift();
  g.table=keep?g.deck.splice(0,4):[c,...g.deck.splice(0,3)];
  dealHands(g,keep?{seat,card:c}:null);
  g.cutCard=null;g.phase='play';g.turn=(g.runner+1)%g.n;return true;
}
function doMove(g,seat,cardId,setIds){
  if(g.over||g.turn!==seat||g.phase!=='play')return false;
  const card=g.hands[seat].find(c=>c.id===cardId);if(!card)return false;
  const caps=legalCaptures(card,g.table);
  let set=null;
  if(caps.length){
    const key=(setIds||[]).slice().sort((a,b)=>a-b).join();
    set=caps.find(s=>s.map(c=>c.id).sort((a,b)=>a-b).join()===key);
    if(!set)return false; // capturing is mandatory
  }else if(setIds&&setIds.length)return false;
  g.hands[seat]=g.hands[seat].filter(c=>c.id!==cardId);
  const tm=teamOf(g.n,seat);
  if(set){
    const ids=new Set(set.map(c=>c.id));g.table=g.table.filter(c=>!ids.has(c.id));
    g.cap[tm].push(card,...set);g.last=tm;
    const lastPlay=g.deck.length===0&&g.hands.every(h=>h.length===0);
    const shk=g.table.length===0&&!lastPlay&&!g.firstPlay?card.r:0;if(shk){g.shk[tm]+=shk;card.chk=true}
    g.evN++;g.ev={type:'cap',seat,cnt:set.length+1,shk,card:{s:card.s,r:card.r,id:card.id,chk:!!shk}};
  }else{g.table.push(card);g.evN++;g.ev={type:'drop',seat,card:{s:card.s,r:card.r,id:card.id}}}
  g.firstPlay=false;
  if(g.hands.every(h=>h.length===0)){if(g.deck.length)dealHands(g);else{endRound(g);return true}}
  g.turn=(seat+1)%g.n;return true;
}
function tally(g){return [0,1].map(k=>{const c=g.cap[k];return {cards:c.length,dia:c.filter(x=>x.s===COIN).length,sev:c.filter(x=>x.r===7).length,six:c.filter(x=>x.r===6).length,h7:c.some(x=>x.s===COIN&&x.r===7)?1:0,shk:g.shk[k]}})}
function endRound(g){
  if(g.last!==null&&g.table.length){g.cap[g.last].push(...g.table);g.table=[]}
  g.over=true;
  if(g.real){g.truth=tally(g);g.phase='count';return} // players count (and may bluff) before scoring
  finalize(g,tally(g),[0,0]);
}
const REPKEYS=['cards','dia','sev','six','h7','shk'];
function cleanRep(r){const o={},lim={cards:40,dia:10,sev:4,six:4,h7:1,shk:200};for(const k of REPKEYS)o[k]=Math.max(0,Math.min(lim[k],Math.floor(+(r&&r[k])||0)));return o}
function sameRep(a,b){return REPKEYS.every(k=>a[k]===b[k])}
function doReport(g,seat,rep){
  if(g.phase!=='count')return false;const k=teamOf(g.n,seat);if(g.rep[k])return false;
  g.rep[k]=cleanRep(rep);if(g.rep[0]&&g.rep[1])g.phase='accuse';return true;
}
function doAccuse(g,seat,acc){
  if(g.phase!=='accuse')return false;const k=teamOf(g.n,seat);if(g.dec[k]!==null)return false;
  g.dec[k]=acc?'acc':'ok';if(g.dec[0]!==null&&g.dec[1]!==null)resolveAccuse(g);return true;
}
function resolveAccuse(g){
  const pen=[0,0],final=[g.rep[0],g.rep[1]];g.verdict=[null,null];
  for(const a of [0,1]){
    if(g.dec[a]!=='acc')continue;const b=1-a;
    if(sameRep(g.rep[b],g.truth[b])){pen[a]++;g.verdict[a]='wrong'}  // false accusation: accuser loses a point
    else{pen[b]++;g.verdict[a]='caught';final[b]=g.truth[b]}          // caught lying: liar loses a point, count corrected
  }
  finalize(g,final,pen);g.phase='result';
}
function applyAct(g,seat,m){
  if(!g||!m)return false;
  if(m.t==='move')return doMove(g,seat,m.cardId,m.setIds);
  if(m.t==='cut')return doCut(g,seat);
  if(m.t==='keep')return doKeep(g,seat,!!m.keep);
  if(m.t==='report')return doReport(g,seat,m.rep);
  if(m.t==='accuse')return doAccuse(g,seat,!!m.acc);
  return false;
}
function finalize(g,R,pen){
  const pts=[0,0],rows=[];
  const cmp=(name,a,b,tie)=>{let r=[0,0];if(a[0]>a[1])r=[1,0];else if(a[1]>a[0])r=[0,1];else if(tie){const b2=tie;if(b2[0]>b2[1])r=[1,0];else if(b2[1]>b2[0])r=[0,1]}
    rows.push({name,v:b||a,p:r});pts[0]+=r[0];pts[1]+=r[1]};
  cmp('mostCards',[R[0].cards,R[1].cards]);
  cmp('mostCoins',[R[0].dia,R[1].dia]);
  const hy=[R[0].h7?1:0,R[1].h7?1:0];
  rows.push({name:'haya',v:hy.map(x=>x?'✓':'—'),p:hy});pts[0]+=hy[0];pts[1]+=hy[1];
  cmp('bermila',[R[0].sev,R[1].sev],null,[R[0].six,R[1].six]);
  const sk=[R[0].shk,R[1].shk];
  rows.push({name:'shk',v:sk,p:sk.slice()});pts[0]+=sk[0];pts[1]+=sk[1];
  const dn=[R[0].dia,R[1].dia];
  const bv=['-','-'],bp=[0,0];let instant=null;g.reset=[false,false];
  for(const k of [0,1]){
    if(dn[k]>=10){bv[k]='WIN';instant=k}
    else if(dn[k]===9){bv[k]='RST'}
    else if(dn[k]===8){bv[k]='B10';bp[k]=10;pts[k]+=10}
  }
  rows.push({name:'diaBonus',v:bv,p:bp});
  if(g.real){rows.push({name:'penalty',v:pen.map(x=>x?'−'+x:'—'),p:pen.map(x=>-x)});pts[0]-=pen[0];pts[1]-=pen[1]}
  g.scores=[Math.max(0,g.scores[0]+pts[0]),Math.max(0,g.scores[1]+pts[1])];g.rows=rows;g.pts=pts;g.over=true;
  for(const k of [0,1])if(dn[k]===9){g.scores[1-k]=0;g.reset[1-k]=true}
  // "both enter the final stretch together" -> target +10
  g.bumped=0;
  while(instantNone(dn)&&g.scores[0]>=g.target-1&&g.scores[1]>=g.target-1){g.target+=10;g.bumped=g.target}
  const w=[0,1].filter(k=>g.scores[k]>=g.target);
  g.winner=w.length===0?null:(w.length===1?w[0]:(g.scores[0]>g.scores[1]?0:1));
  if(instant!==null){g.winner=instant;g.bumped=0}
  if(g.real){ // Runner passes right after round 1, then only when their team is strictly ahead
    const rt=teamOf(g.n,g.runner);
    const pass=g.roundNo===1||g.scores[rt]>g.scores[1-rt];
    g.roundNo++;if(pass)g.runner=(g.runner+1)%g.n;g.dealer=g.runner;
  }else g.dealer=(g.dealer+1)%g.n;
}
function instantNone(dn){return dn[0]<10&&dn[1]<10}
function viewFor(g,seat){
  const my=teamOf(g.n,seat),show=g.real&&(g.phase==='count'||g.phase==='accuse');
  return {n:g.n,seat,table:g.table,hand:g.hands[seat],counts:g.hands.map(h=>h.length),capCounts:g.cap.map(c=>c.length),
    scores:g.scores,target:g.target,turn:g.turn,ev:g.ev,over:g.over,rows:g.rows,pts:g.pts,winner:g.winner,bumped:g.bumped,deck:g.deck.length,evN:g.evN,reset:g.reset,
    real:g.real,phase:g.phase,runner:g.runner,cutter:g.cutter,cutDone:!!g.cutCard,cutCard:seat===g.cutter?g.cutCard:null,
    myCap:show?g.cap[my]:null,rep:g.phase==='count'?g.rep.map((r,k)=>k===my?r:null):g.rep,repDone:g.rep.map(r=>!!r),decDone:g.dec.map(d=>d!==null),verdict:g.verdict};
}

/* ================= computer players ================= */
function unseenInfo(g,seat){
  const seen=new Set();g.table.forEach(c=>seen.add(c.id));g.hands[seat].forEach(c=>seen.add(c.id));
  g.cap.forEach(a=>a.forEach(c=>seen.add(c.id)));
  const cnt=Array(11).fill(0);let tot=0;
  for(let s=0;s<4;s++)for(let r=1;r<=10;r++)if(!seen.has(s*10+r)){cnt[r]++;tot++}
  return {cnt,tot};
}
function capValue(card,set,table){
  let v=set.length+1;
  for(const c of [card,...set]){if(c.s===COIN)v+=1.5;if(c.r===7)v+=2;if(c.r===6)v+=.4;if(c.s===COIN&&c.r===7)v+=6}
  if(set.length===table.length)v+=card.r+2;
  return v;
}
function riskAfter(table,un,oppCards){ // chance an opponent can clear the leftover table
  if(!table.length)return 0;
  let p=0;
  for(let r=1;r<=10;r++){
    if(!un.cnt[r])continue;
    const caps=legalCaptures({r},table);
    if(caps.some(s=>s.length===table.length))p+=un.cnt[r]/Math.max(1,un.tot)*Math.min(3,oppCards);
  }
  return Math.min(1,p);
}
function cpuChoose(g,seat){
  const hand=g.hands[seat],diff=g.diff;
  const options=[];
  for(const card of hand){
    const caps=legalCaptures(card,g.table);
    if(caps.length)caps.forEach(set=>options.push({card,set}));
  }
  if(diff==='easy'){
    if(options.length)return options[Math.floor(Math.random()*options.length)];
    return {card:hand[Math.floor(Math.random()*hand.length)],set:null};
  }
  const un=diff==='hard'?unseenInfo(g,seat):null;
  const oppCards=3;
  if(options.length){
    let best=null,bv=-1e9;
    for(const o of options){
      let v=capValue(o.card,o.set,g.table);
      if(diff==='hard'){
        const ids=new Set(o.set.map(c=>c.id));
        const rest=g.table.filter(c=>!ids.has(c.id));
        v-=riskAfter(rest,un,oppCards)*7;
        v-=(o.card.r===7||o.card.s===COIN&&o.card.r>5)?0:0;
      }else v+=Math.random()*1.2;
      if(v>bv){bv=v;best=o}
    }
    return best;
  }
  let drop=hand[0],dv=1e9;
  for(const card of hand){
    let v=card.r*0.1+(card.s===COIN?3:0)+(card.r===7?5:0)+(card.s===COIN&&card.r===7?20:0);
    const nt=g.table.concat([card]);
    if(diff==='hard')v+=riskAfter(nt,un,oppCards)*9;
    else{const sum=nt.reduce((a,c)=>a+c.r,0);if(sum<=10)v+=8}
    if(v<dv){dv=v;drop=card}
  }
  return {card:drop,set:null};
}

const seatsOfTeam=(g,k)=>Array.from({length:g.n},(_,i)=>i).filter(i=>teamOf(g.n,i)===k);
function cpuBluff(g,k){
  const r={...g.truth[k]};
  const p={easy:.15,medium:.25,hard:.3}[g.diff]||.2;
  if(Math.random()<p){const ks=['cards','dia','sev','shk'];const f=ks[Math.floor(Math.random()*ks.length)];r[f]+=1+(Math.random()<.4?1:0)}
  return r;
}
function realCpuStep(){ // one computer action in the realistic phases; returns true if something changed
  const g=G;if(!g||!g.real)return false;
  if(g.phase==='cut'&&g.types[g.cutter]==='cpu'){
    if(!g.cutCard)return doCut(g,g.cutter);
    const c=g.cutCard;return doKeep(g,g.cutter,c.s===COIN||c.r===7||(c.r>=5&&Math.random()<.5));
  }
  if(g.phase==='count'){for(const k of [0,1])if(!g.rep[k]&&seatsOfTeam(g,k).every(s=>g.types[s]==='cpu'))return doReport(g,seatsOfTeam(g,k)[0],cpuBluff(g,k))}
  if(g.phase==='accuse'){for(const k of [0,1])if(g.dec[k]===null&&seatsOfTeam(g,k).every(s=>g.types[s]==='cpu')){
    const lie=!sameRep(g.rep[1-k],g.truth[1-k]);const pr={easy:[.25,.2],medium:[.5,.1],hard:[.8,.05]}[g.diff]||[.5,.1];
    return doAccuse(g,seatsOfTeam(g,k)[0],Math.random()<(lie?pr[0]:pr[1]));
  }}
  return false;
}

/* ================= controller (offline / host / client) ================= */
const $=id=>document.getElementById(id);
let G=null,V=null,NET={role:'local',peer:null,conns:{},lobby:null,mySeat:0,code:null};
let cfg={mode:'offline',n:2,target:31,custom:21,customOn:false,diff:'medium',real:false};
try{Object.assign(cfg,JSON.parse(ls('shkoba-cfg')||'{}'))}catch(e){}
function saveCfg(){ls('shkoba-cfg',JSON.stringify(cfg))}
let ui={sel:null,pick:[],cpuTimer:null,realTimer:null,rep:null};

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}

function broadcast(){
  if(!G)return;
  V=viewFor(G,NET.mySeat);
  for(const [seat,conn] of Object.entries(NET.conns)){if(conn.open)conn.send({t:'view',v:viewFor(G,+seat)})}
  render();
  if(!G.over&&G.types[G.turn]==='cpu'&&!ui.cpuTimer){
    ui.cpuTimer=setTimeout(()=>{ui.cpuTimer=null;if(!G||G.over)return;const s=G.turn;if(G.types[s]!=='cpu')return;
      const m=cpuChoose(G,s);doMove(G,s,m.card.id,m.set?m.set.map(c=>c.id):null);broadcast()},950);
  }
  if(G.real&&['cut','count','accuse'].includes(G.phase)&&!ui.realTimer){
    ui.realTimer=setTimeout(()=>{ui.realTimer=null;if(G&&realCpuStep())broadcast()},1200);
  }
}
function submitAct(m){
  if(NET.role==='client'){NET.conn.send(m);return}
  if(applyAct(G,NET.mySeat,m))broadcast();
}
function submitMove(cardId,setIds){submitAct({t:'move',cardId,setIds})}

/* ---- start / lobby ---- */
function seatTypesOffline(n){return Array.from({length:n},(_,i)=>i===0?'local':'cpu')}
function startOffline(){
  NET={role:'local',peer:null,conns:{},mySeat:0};
  G=makeGame({n:cfg.n,target:effTarget(),diff:cfg.diff,types:seatTypesOffline(cfg.n),real:cfg.real});
  resetUI();resetAnim();show('game');broadcast();
}
function effTarget(){return cfg.customOn?Math.max(5,Math.min(500,+cfg.custom||21)):cfg.target}
function resetUI(){ui.sel=null;ui.pick=[];ui.rep=null;if(ui.realTimer){clearTimeout(ui.realTimer);ui.realTimer=null};$('modal').classList.remove('on');if(ui.cpuTimer){clearTimeout(ui.cpuTimer);ui.cpuTimer=null}}
function leaveAll(){
  resetUI();G=null;V=null;
  try{if(NET.peer)NET.peer.destroy()}catch(e){}
  NET={role:'local',peer:null,conns:{},mySeat:0};
  show('menu');renderMenu();
}
const CODECH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function randCode(){let s='';for(let i=0;i<4;i++)s+=CODECH[Math.floor(Math.random()*CODECH.length)];return s}
function lobbyMsg(){return {t:'lobby',n:cfg.n,target:effTarget(),diff:cfg.diff,seats:NET.lobby.seats}}
function pushLobby(){for(const c of Object.values(NET.conns))if(c.open)c.send(lobbyMsg());renderLobby()}
function createRoom(attempt=0){
  $('netErr').textContent='';
  if(typeof Peer==='undefined'||!navigator.onLine){$('netErr').textContent=t('needNet');return}
  const code=randCode();
  const peer=new Peer('shkoba-'+code);
  NET={role:'host',peer,conns:{},lobby:{seats:Array.from({length:cfg.n},(_,i)=>i===0?'host':null)},mySeat:0,code};
  peer.on('open',()=>{show('lobby');renderLobby()});
  peer.on('error',e=>{
    if(e.type==='unavailable-id'&&attempt<5){try{peer.destroy()}catch(_){}createRoom(attempt+1);return}
    $('netErr').textContent=t('needNet');try{peer.destroy()}catch(_){}NET={role:'local',peer:null,conns:{},mySeat:0};show('menu')});
  peer.on('connection',conn=>{
    conn.on('open',()=>{
      if(G){ // game running: only allow reclaiming nothing; reject
        conn.send({t:'full'});setTimeout(()=>conn.close(),300);return}
      const seat=NET.lobby.seats.findIndex(s=>s===null);
      if(seat<0){conn.send({t:'full'});setTimeout(()=>conn.close(),300);return}
      NET.lobby.seats[seat]='remote';NET.conns[seat]=conn;
      conn.send({t:'welcome',seat});pushLobby();
    });
    conn.on('data',d=>{
      const seat=+Object.keys(NET.conns).find(k=>NET.conns[k]===conn);
      if(d&&G&&d.t&&applyAct(G,seat,d))broadcast();
    });
    const gone=()=>{
      const k=Object.keys(NET.conns).find(k=>NET.conns[k]===conn);if(k===undefined)return;
      delete NET.conns[k];
      if(G){G.types[k]='cpu';broadcast()}else{NET.lobby.seats[k]=null;pushLobby()}
    };
    conn.on('close',gone);conn.on('error',gone);
  });
}
function hostStart(){
  const types=NET.lobby.seats.map((s,i)=>i===0?'local':s==='remote'?'remote':'cpu');
  G=makeGame({n:cfg.n,target:effTarget(),diff:cfg.diff,types,real:cfg.real});
  for(const [seat,conn] of Object.entries(NET.conns))if(conn.open)conn.send({t:'start',n:cfg.n});
  resetUI();resetAnim();show('game');broadcast();
}
function joinRoom(){
  $('netErr').textContent='';
  const code=$('joinCode').value.trim().toUpperCase();
  if(code.length!==4)return;
  if(typeof Peer==='undefined'||!navigator.onLine){$('netErr').textContent=t('needNet');return}
  const peer=new Peer();
  NET={role:'client',peer,conns:{},lobby:null,mySeat:0,code};
  let joined=false;
  const fail=msg=>{if(NET.peer!==peer)return;$('netErr').textContent=msg;leaveAll();$('netErr').textContent=msg};
  peer.on('error',()=>fail(joined?t('lost'):t('roomNotFound')));
  peer.on('open',()=>{
    const conn=peer.connect('shkoba-'+code,{reliable:true});NET.conn=conn;
    const to=setTimeout(()=>{if(!joined)fail(t('roomNotFound'))},8000);
    conn.on('open',()=>{joined=true;clearTimeout(to)});
    conn.on('data',d=>{
      if(d.t==='welcome'){NET.mySeat=d.seat}
      else if(d.t==='full'){fail(t('roomNotFound'))}
      else if(d.t==='lobby'){NET.lobby=d;cfg.n=d.n;show('lobby');renderLobby()}
      else if(d.t==='start'){resetUI();resetAnim();G=null;show('game')}
      else if(d.t==='view'){V=d.v;render()}
    });
    conn.on('close',()=>{if(NET.peer===peer)fail(t('lost'))});
  });
}

}
function seatEl(s,vertical){

function eventText(){

function render(){
  if(!V)return;

  const my=teamOf(V.n,V.seat),th=1-my;

  // table
  const hint=new Set();
  const selCard=ui.sel?V.hand.find(c=>c.id===ui.sel):null;
  if(!selCard)ui.sel=null;
  if(selCard)legalCaptures(selCard,V.table).forEach(s=>s.forEach(c=>hint.add(c.id)));
  const tb=$('table');tb.innerHTML='';
  V.table.forEach(c=>{
    const cls='small'+(ui.pick.includes(c.id)?' pick':hint.has(c.id)?' hint':'');
    const e=cardEl(c,cls);e.dataset.id=c.id;e.style.rotate=((c.id*37%9)-4)+'deg';e.onclick=()=>tapTable(c);tb.appendChild(e)});
  // hand

  $('log').textContent=eventText();
  const mine=V.turn===V.seat&&!V.over;
  $('status').textContent=V.real&&V.phase==='cut'?t('cutTitle'):V.real&&V.phase==='count'?t('countTitle'):V.real&&V.phase==='accuse'?t('accTitle'):V.over?t('roundEnd'):mine?(ui.sel?t('pickTable'):t('yourTurn')):t('waitFor')+' '+nameOf(V.turn);
  const caps=selCard?legalCaptures(selCard,V.table):[];
  $('takeBtn').disabled=!(selCard&&matchSet(caps));
  $('clearBtn').disabled=!ui.sel;
  try{animateChanges()}catch(e){}

}
function matchSet(caps){
  if(!ui.pick.length)return null;
  const key=ui.pick.slice().sort((a,b)=>a-b).join();
  return caps.find(s=>s.map(c=>c.id).sort((a,b)=>a-b).join()===key)||null;
}
function myTurn(){return V&&V.turn===V.seat&&!V.over}
function tapHand(c){
  if(!myTurn())return;
  ui.pick=[];ui.sel=c.id;
  const caps=legalCaptures(c,V.table);
  if(caps.length===0){ui.sel=null;submitMove(c.id,null);return}
  if(caps.length===1){ui.sel=null;submitMove(c.id,caps[0].map(x=>x.id));return}
  render();
}
function tapTable(c){
  if(!myTurn()||!ui.sel)return;
  const i=ui.pick.indexOf(c.id);if(i>=0)ui.pick.splice(i,1);else ui.pick.push(c.id);
  const card=V.hand.find(x=>x.id===ui.sel);const caps=legalCaptures(card,V.table);
  if(caps.every(s=>s.length===1)&&ui.pick.length===1){const m=matchSet(caps);if(m){const id=ui.sel;ui.sel=null;const ids=m.map(x=>x.id);ui.pick=[];submitMove(id,ids);return}}
  render();
}
$('takeBtn').onclick=()=>{
  const card=V.hand.find(x=>x.id===ui.sel);if(!card)return;const m=matchSet(legalCaptures(card,V.table));
  if(m){const id=ui.sel;ui.sel=null;ui.pick=[];submitMove(id,m.map(x=>x.id))}};
$('clearBtn').onclick=()=>{ui.sel=null;ui.pick=[];render()};

let PREV={evN:-1,hand:new Set(),table:[],counts:[],rects:{},scores:null};

function chkobaFx(points){
  const fx=$('fx');
  const d=document.createElement('div');d.className='chk';d.textContent=t('evShk')+' +'+points;fx.appendChild(d);
  setTimeout(()=>d.remove(),1700);

  for(let i=0;i<28;i++){const c=document.createElement('div');c.className='conf';c.style.background=cols[i%5];

function animateChanges(){
  const ev=V.ev,isNew=ev&&V.evN!==PREV.evN;
  const tbEls={},meEls={};
  document.querySelectorAll('#table [data-id]').forEach(e=>tbEls[e.dataset.id]=e);
  document.querySelectorAll('#me [data-id]').forEach(e=>meEls[e.dataset.id]=e);
  const prevTableIds=new Set(PREV.table.map(c=>c.id));
  const vanished=PREV.table.filter(c=>!V.table.some(x=>x.id===c.id));
  const origin=()=>{const r=PREV.rects[ev.card.id];return r||seatRect(ev.seat)};
  // deal animation for new hand cards
  let i=0;
  const tcr=$('table').getBoundingClientRect(),dcx=tcr.left+tcr.width/2,dcy=tcr.top+tcr.height/2;
  V.hand.forEach(c=>{if(!PREV.hand.has(c.id)){const e=meEls[c.id];
    if(e){const fr=e.getBoundingClientRect(),dx=dcx-fr.left-fr.width/2,dy=dcy-fr.top-fr.height/2,sg=i%2?1:-1;
      e.animate([{transform:`translate(${dx}px,${dy}px) scale(.55) rotate(${sg*(14+i*5)}deg)`,opacity:0},{opacity:1,offset:.2},{transform:`translate(${dx*.25}px,${dy*.25-18}px) scale(1.06) rotate(${-sg*4}deg)`,offset:.75},{transform:'none',opacity:1}],{duration:620,delay:i*140,easing:'cubic-bezier(.25,.8,.3,1)',fill:'backwards'})}
    i++}});
  // opponents' hands refilled
  document.querySelectorAll('.seat .hand').forEach(h=>{const s=+h.parentNode.dataset.seat;
    if(PREV.counts[s]!==undefined&&V.counts[s]>PREV.counts[s])h.animate([{opacity:0,transform:'translateY(-30px)'},{opacity:1,transform:'none'}],{duration:450})});
  // table cards
  V.table.forEach(c=>{
    const e=tbEls[c.id];if(!e||prevTableIds.has(c.id))return;
    const fr=e.getBoundingClientRect();
    if(isNew&&ev.type==='drop'&&ev.card.id===c.id){
      const o=origin();
      const dx=o.left-fr.left,dy=o.top-fr.top,sg=(c.id%2?1:-1);
      e.animate([{transform:`translate(${dx}px,${dy}px) scale(${o.width/fr.width||1}) rotate(${sg*10}deg)`,opacity:.75},{transform:`translate(${dx*.4}px,${dy*.4-38}px) scale(1.14) rotate(${sg*5}deg)`,opacity:1,offset:.55},{transform:'scale(.96)',offset:.88},{transform:'none'}],{duration:520,easing:'ease-out'});
    }else{
      e.animate([{transform:`translateY(-220px) scale(.5) rotate(${(i%2?1:-1)*20}deg)`,opacity:0},{transform:'translateY(6px) scale(1.04)',offset:.8,opacity:1},{transform:'none',opacity:1}],{duration:520,delay:(i++)*110,easing:'cubic-bezier(.2,.8,.3,1)',fill:'backwards'});
    }
  });
  // captures
  if(isNew&&ev.type==='cap'){
    const tr=seatRect(ev.seat),tx=tr.left+tr.width/2,ty=tr.top+tr.height/2;
    const rects=vanished.map(c=>PREV.rects[c.id]).filter(Boolean);
    let cx=0,cy=0;rects.forEach(r=>{cx+=r.left+r.width/2;cy+=r.top+r.height/2});
    if(rects.length){cx/=rects.length;cy/=rects.length}
    vanished.forEach((c,vi)=>{const r=PREV.rects[c.id];if(!r)return;const g=ghost(c,r);
      g.animate([{transform:'none',offset:0},{transform:'scale(1.12) rotate(-3deg)',offset:.4},{transform:'scale(1.05)',offset:.5},{transform:`translate(${tx-(r.left+r.width/2)}px,${ty-(r.top+r.height/2)}px) scale(.35) rotate(${vi%2?28:-22}deg)`,opacity:0,offset:1}],{duration:950,delay:vi*60,easing:'ease-in'}).onfinish=()=>g.remove()});
    const o=origin();const pg=ghost(ev.card,o);
    const ox=o.left+o.width/2,oy=o.top+o.height/2;
    pg.animate([{transform:'none',offset:0},{transform:`translate(${(rects.length?cx:tx)-ox}px,${(rects.length?cy:ty)-oy}px)`,offset:.4},{transform:`translate(${(rects.length?cx:tx)-ox}px,${(rects.length?cy:ty)-oy}px)`,offset:.5},{transform:`translate(${tx-ox}px,${ty-oy}px) scale(.35) rotate(25deg)`,opacity:0,offset:1}],{duration:900,easing:'ease-in-out'}).onfinish=()=>pg.remove();
    if(ev.shk)chkobaFx(ev.shk);
  }
  // score pulse
  if(PREV.scores&&(PREV.scores[0]!==V.scores[0]||PREV.scores[1]!==V.scores[1])){const sc=$('score');sc.classList.remove('pulse');void sc.offsetWidth;sc.classList.add('pulse')}
  // record state
  PREV.evN=V.evN;PREV.hand=new Set(V.hand.map(c=>c.id));PREV.table=V.table.slice();PREV.counts=V.counts.slice();PREV.scores=V.scores.slice();
  PREV.rects={};
  Object.entries(tbEls).forEach(([id,e])=>PREV.rects[id]=e.getBoundingClientRect());
  Object.entries(meEls).forEach(([id,e])=>PREV.rects[id]=e.getBoundingClientRect());
}

/* ---- misc wiring ---- */
$('langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';ls('shkoba-lang',lang);renderMenu();if(NET.lobby)renderLobby();if(V)render()};
$('rulesBtn').onclick=()=>{const m=$('modal');m.dataset.kind='rules';
  $('modalBox').innerHTML=`<h2>${t('rules')}</h2>${t('rulesText')}<div class="acts"><button id="mClose">${t('ok')}</button></div>`;
  m.classList.add('on');$('mClose').onclick=()=>m.classList.remove('on')};
$('customTarget').oninput=e=>{cfg.custom=+e.target.value;saveCfg()};
$('startBtn').onclick=()=>startOffline();
$('createBtn').onclick=()=>createRoom();
$('joinBtn').onclick=()=>joinRoom();
$('lobbyStart').onclick=()=>hostStart();
$('lobbyLeave').onclick=()=>leaveAll();
renderMenu();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
